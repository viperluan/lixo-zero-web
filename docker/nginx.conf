server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff font/woff2;

  # Arquivos gerados pelo Vite levam hash no nome, entao podem ser cacheados
  # indefinidamente.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # O index.html nao pode ser cacheado: ele e o unico ponto que aponta para os
  # bundles novos depois de cada deploy.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # O app usa BrowserRouter, logo qualquer rota desconhecida precisa devolver o
  # index.html para o roteamento acontecer no cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
